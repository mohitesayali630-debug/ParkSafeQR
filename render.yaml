services:
  # ------------------------------------------------------------
  # DJANGO BACKEND WEB SERVICE
  # ------------------------------------------------------------
  - type: web
    name: parksafe-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/manage.py collectstatic --no-input
    startCommand: gunicorn --chdir backend parksafe_backend.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parksafe-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "parksafe-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://parksafe-frontend.onrender.com"

  # ------------------------------------------------------------
  # REACT FRONTEND STATIC SITE
  # ------------------------------------------------------------
  - type: web
    name: parksafe-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: "https://parksafe-backend.onrender.com/api"
      - key: REACT_APP_FRONTEND_URL
        value: "https://parksafe-frontend.onrender.com"

databases:
  # ------------------------------------------------------------
  # MANAGED POSTGRESQL DATABASE
  # ------------------------------------------------------------
  - name: parksafe-db
    plan: free
    databaseName: parksafe_db
    user: postgres
